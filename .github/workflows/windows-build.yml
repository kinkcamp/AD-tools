name: Windows Build

on:
  # 打 v* 标签时自动打包，也支持在 Actions 页面手动触发
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install frontend dependencies
        run: npm ci

      # 只打 NSIS：WiX 3 的 light.exe 对中文产品名（AD域控助手）有 bug，MSI 会失败
      - name: Build Tauri app (NSIS)
        run: npx tauri build --bundles nsis

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: AD域控助手-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # tag 触发时同步发布到 GitHub Release，提供永久公开下载链接
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
